name: moove
description: "Una aplicación móvil para la gestión de transporte público institucional, que permite a los usuarios consultar horarios y rutas de autobuses en tiempo real."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  sqflite: ^2.4.1
  path: ^1.9.0
  connectivity_plus: ^6.1.0
  uuid: ^4.5.1
  mobile_scanner: ^6.0.2
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  flutter_svg: ^2.0.10+1
  http: ^1.2.0
  flutter_dotenv: ^6.0.0
  shared_preferences: ^2.5.4
  flutter:
    sdk: flutter
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  flutter_native_splash: ^2.4.4
  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.2
  lottie: ^3.1.2
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/MooveV3.png"
  adaptive_icon_background: "assets/MooveV3_background.png"
  adaptive_icon_foreground: "assets/MooveV3_foreground.png"

flutter:
  assets:
    - assets/animations/moove_splash.json
    - assets/icons/Moove_Bus.svg
  uses-material-design: true
  fonts:
    - family: Harmattan
      fonts:
        - asset: assets/fonts/Harmattan-Regular.ttf

flutter_native_splash:
  color: "#E20000"
  image: assets/MooveV3.svg
  fullscreen: true

  android_12:
    color: "#E20000"
    image: assets/MooveV3.svg
